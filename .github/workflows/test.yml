name: Tests


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        # Lint first — a syntax or style error in src/tests/scripts
        # fails fast before we burn minutes on pytest.
        run: ruff check src/ tests/ scripts/

      - name: Run pytest (unit tests + MATLAB parity)
        run: pytest --cov=pyspt --cov-report=term-missing

      - name: Check API export is up to date
        # docs/data/api.json must reflect the live @parity_verified
        # registry. Run AFTER pytest so a fixture mismatch also fails
        # the parity test (defence in depth). --check never writes
        # files; if it exits non-zero here, regenerate locally with
        # `python scripts/export_api.py` and commit.
        run: python scripts/export_api.py --check